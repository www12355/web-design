<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>员工展示卡 ｜ AI 自主经营中枢</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%230A84FF'/%3E%3Ccircle cx='16' cy='15' r='6.5' fill='%230A0A0B'/%3E%3Ccircle cx='13.4' cy='13.8' r='1.5' fill='%230A84FF'/%3E%3Ccircle cx='18.6' cy='13.8' r='1.5' fill='%230A84FF'/%3E%3Cpath d='M13 18.5q3 2.4 6 0' stroke='%230A84FF' stroke-width='1.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="src/styles/components.css">
<link rel="stylesheet" href="src/styles/pages/employee.css">
</head>
<body data-world-prio="4" data-page2="employee">

<!-- 员工展示卡（P3-2）：双模式页面 ——
     employee.html          = 轮播模式（运行中靠前的名单，每数秒步进一位）；
     employee.html?emp=uid  = 独立页模式（该员工的稳定唯一 URL，注册表 12 名全员可用）。
     无卡片容器：左侧放大的数字员工 + 右侧介绍/技能(真实软件图标)/八边形雷达/思考过程。 -->
<main class="emp-stage">
  <header class="emp-head">
    <span class="emp-head__meta num" id="emp-count">— / —</span>
  </header>

  <section class="emp-hero" id="emp-card" data-emp="" tabindex="0">
    <!-- 左：放大的数字员工（进度环 + 头像球） -->
      <div class="emp-figure">
        <div class="ec-side">
          <svg class="emp-ring" viewBox="0 0 160 160" aria-hidden="true">
            <circle class="bg" cx="80" cy="80" r="74"></circle>
            <circle class="fg" id="emp-ring-fg" cx="80" cy="80" r="74"></circle>
          </svg>
          <div class="emp-card__orb" id="emp-orb"></div>
        </div>
      </div>

      <!-- 右：档案列 —— 身份头 / 数据带（知识库 + 当前任务）/ 能力构成 / 雷达+思考 -->
      <div class="emp-detail">
        <header class="ec-head">
          <span class="emp-id num" id="emp-id">—</span>
          <i class="emp-sig" id="emp-sig" aria-hidden="true"></i>
          <b class="emp-name" id="emp-name">—</b>
          <em class="emp-role" id="emp-role">—</em>
          <span class="emp-status">
            <span class="emp-status__ic" id="emp-ic" aria-hidden="true"></span>
            <i class="dot" id="emp-dot"></i>
            <span id="emp-status-txt">—</span>
          </span>
        </header>

        <div class="ec-band">
          <div class="ec-stat">
            <span class="ec-label">知识库 · 近12h入库</span>
            <b class="ec-stat__num num" id="emp-kb">—</b>
          </div>
          <div class="ec-taskwrap">
            <span class="ec-label">当前任务</span>
            <p class="ec-task" id="emp-task">—</p>
            <div class="ec-progress">
              <div class="track"><i id="emp-track"></i></div>
              <b class="ec-progress__num num" id="emp-pct">0%</b>
            </div>
          </div>
        </div>

        <section class="ec-skills-block">
          <span class="ec-label">能力构成<i class="ec-label__en" lang="en">SKILLS</i></span>
          <div class="emp-skills" id="emp-skills"></div>
        </section>

        <div class="ec-bottom">
          <figure class="ec-radar">
            <svg class="emp-radar" id="emp-radar" viewBox="0 0 240 200" role="img" aria-label="技能八角雷达图"></svg>
          </figure>
          <div class="ec-mind">
            <p class="emp-think" id="emp-think">—</p>
            <ol class="emp-log" id="emp-log"></ol>
          </div>
        </div>
      </div>
  </section>

  <footer class="emp-card__foot">
    <button type="button" class="emp-navbtn" id="emp-prev" aria-label="上一位员工"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
    <div class="emp-dots" id="emp-dots" role="tablist" aria-label="员工索引"></div>
    <button type="button" class="emp-navbtn" id="emp-next" aria-label="下一位员工"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button>
    <a class="emp-link" id="emp-link" href="employee.html">独立页 →</a>
  </footer>

  <p class="emp-hint" id="emp-hint">← → 切换员工 · 数据经世界引擎实时同步</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="module" src="src/modules/ball-core.js"></script>
<script type="module" src="src/modules/bloub.js"></script>
<script type="module" src="src/controllers/employee.js"></script>
</body>
</html>
